syntax = "proto3";

import "google/protobuf/empty.proto";

option go_package = "github.com/cirruslabs/tart-guest-agent/pkg/v1";

service Agent {
  rpc Exec(stream ExecRequest) returns (stream ExecResponse);
  rpc Signal(SignalRequest) returns (google.protobuf.Empty);
  rpc ResolveIP(ResolveIPRequest) returns (ResolveIPResponse);
  // Optional managed macOS users. An unknown boot ID never authorizes mutation.
  rpc UserInfo(google.protobuf.Empty) returns (UserInfoResponse);
  rpc CreateUser(CreateUserRequest) returns (ManagedUser);
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty);
}

message UserInfoResponse {
  string boot_id = 1;
  bool healthy = 2;
}

message CreateUserRequest {
  string request_id = 1;
  string boot_id = 2;
}

message DeleteUserRequest {
  string id = 1;
  string boot_id = 2;
}

message ManagedUser {
  string id = 1;
  string username = 2;
  uint32 uid = 3;
  uint32 gid = 4;
  string home = 5;
  string temporary_directory = 6;
}

message ExecRequest {
  message Command {
    string name = 1;
    repeated string args = 2;
    bool interactive = 3;
    bool tty = 4;
    TerminalSize terminal_size = 5;
    bool detach = 6;
    map<string, string> env = 7;
    string workdir = 8;
    string user = 9;
  }

  oneof type {
    Command command = 1;
    IOChunk standard_input = 2;
    TerminalSize terminal_resize = 3;
  }
}

message ExecResponse {
  message Exit {
    int32 code = 1;
  }

  message Started {
    string exec_id = 1;
  }

  // Managed-user commands acknowledge actual stdin writes. Offset excludes
  // private launch data; eof confirms the workload's stdin was closed.
  message InputAck {
    uint64 offset = 1;
    bool eof = 2;
  }

  oneof type {
    Exit exit = 1;
    IOChunk standard_output = 2;
    IOChunk standard_error = 3;
    Started started = 4;
    InputAck input_ack = 5;
  }
}

message TerminalSize {
  uint32 rows = 1;
  uint32 cols = 2;
}

message IOChunk {
  bytes data = 1;
}

message ResolveIPRequest {
  // nothing for now
}

message ResolveIPResponse {
  string ip = 1;
}

message SignalRequest {
  enum Signal {
    SIGNAL_UNSPECIFIED = 0;
    SIGNAL_SIGTERM = 1;
    SIGNAL_SIGKILL = 2;
  }

  string exec_id = 1;
  Signal signal = 2;
}
